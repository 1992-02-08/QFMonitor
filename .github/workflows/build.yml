name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install theos
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install ldid (signing tool)
        run: |
          brew install ldid || (which ldid && echo "ldid already present")

      - name: Build app and package
        run: |
          make clean || true
          make
          APP=".theos/obj/arm64/QFMonitor.app"
          ls -la "$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/QFMonitor.app
          cp Info.plist Payload/QFMonitor.app/Info.plist
          zip -qry QFMonitor.ipa Payload
          ls -la QFMonitor.ipa


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QFMonitor.ipa
          path: QFMonitor.ipa
          if-no-files-found: error
