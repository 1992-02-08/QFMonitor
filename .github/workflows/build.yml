name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install theos
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install ldid (signing tool)
        run: |
          brew install ldid || (which ldid && echo "ldid already present")

      - name: Build app and package
        run: |
          make clean || true
          make package FINALPACKAGE=1
          find .theos -name "*.ipa" -exec cp {} ./QFMonitor.ipa \;
          ls -la QFMonitor.ipa || true


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QFMonitor.ipa
          path: QFMonitor.ipa
          if-no-files-found: error
