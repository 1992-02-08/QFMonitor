name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install theos
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build app
        run: |
          make clean || true
          make
          find .theos -name "*.app" -maxdepth 4 2>/dev/null || true

      - name: Package IPA
        run: |
          APP=.theos/_/Applications/QFMonitor.app
          if [ ! -d "$APP" ]; then echo "app not found"; exit 1; fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/QFMonitor.app
          cd build && zip -r ../QFMonitor.ipa Payload
          ls -la ../QFMonitor.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QFMonitor.ipa
          path: QFMonitor.ipa
          if-no-files-found: error
