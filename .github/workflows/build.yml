name: Build IPA (Linux Fast-Track)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm ldid zip curl git python3

      - name: Download iOS SDK
        run: |
          echo "Downloading iOS SDK..."
          curl -L -o /tmp/sdk.zip "https://github.com/xybp888/iOS-SDKs/releases/download/iOS27.1-SDKs/iPhoneOS27.1.sdk.zip"
          unzip -q /tmp/sdk.zip -d /tmp/sdk
          ls -la /tmp/sdk

      - name: Patch SDK TBD files for standard lld
        run: |
          python3 -c '
import os, glob
sdk_path = glob.glob("/tmp/sdk/**/iPhoneOS*.sdk", recursive=True)[0]
print(f"Target SDK: {sdk_path}")
with open("/tmp/target_sdk.env", "w") as f:
    f.write(f"SDK_PATH={sdk_path}\n")

count = 0
for root, _, files in os.walk(sdk_path):
    for file in files:
        if file.endswith(".tbd"):
            fp = os.path.join(root, file)
            try:
                with open(fp, "r", encoding="utf-8", errors="ignore") as f:
                    lines = f.readlines()
                new_lines = []
                for line in lines:
                    if "arm64e.x1-ios" in line:
                        continue
                    new_lines.append(line)
                new_txt = "".join(new_lines)
                with open(fp, "w", encoding="utf-8") as f:
                    f.write(new_txt)
                count += 1
            except Exception as e:
                pass
print(f"Patched {count} TBD files")
'

      - name: Compile and Link
        run: |
          source /tmp/target_sdk.env
          mkdir -p build/Payload/QFMonitor.app
          
          echo "Compiling Objective-C source files..."
          clang -target arm64-apple-ios14.0 \
                -isysroot "$SDK_PATH" \
                -fobjc-arc \
                -O2 \
                -c main.m QFAppDelegate.m QFMonitorController.m QFRowView.m QFPanelView.m QFMetrics.m QFPrefs.m
          
          echo "Linking binary with lld..."
          clang -target arm64-apple-ios14.0 \
                -isysroot "$SDK_PATH" \
                -fuse-ld=lld \
                -Wl,-undefined,dynamic_lookup \
                -framework Foundation \
                -framework UIKit \
                -framework CoreGraphics \
                -framework IOKit \
                *.o -o build/Payload/QFMonitor.app/QFMonitor
          
          echo "Copying metadata..."
          cp Info.plist build/Payload/QFMonitor.app/
          
          echo "Signing with ldid..."
          ldid -S build/Payload/QFMonitor.app/QFMonitor

      - name: Package IPA
        run: |
          cd build
          zip -r ../QFMonitor.ipa Payload
          cd ..
          ls -lh QFMonitor.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QFMonitor-ipa
          path: QFMonitor.ipa
          retention-days: 7
