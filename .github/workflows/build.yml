name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid (signing tool)
        run: |
          brew install ldid || (which ldid && echo "ldid already present")

      - name: Build IPA with build.sh
        run: |
          chmod +x build.sh
          ./build.sh QFMonitor.ipa
          ls -la QFMonitor.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QFMonitor.ipa
          path: QFMonitor.ipa
          if-no-files-found: error
